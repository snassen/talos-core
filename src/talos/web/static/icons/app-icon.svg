<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Talos</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#2b2117"/>
      <stop offset="1" stop-color="#0b0806"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c47c"/>
      <stop offset="0.28" stop-color="#d69e55"/>
      <stop offset="0.497" stop-color="#b47b3c"/>
      <stop offset="0.503" stop-color="#8a5628"/>
      <stop offset="1" stop-color="#4a2c13"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="226"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- orbit: three circuits of Crete a day -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#c48a44" stroke-opacity=".5" stroke-width="3"/>
  <g fill="#e6b066">
    <circle cx="256" cy="20" r="7"/><circle cx="51.6" cy="374" r="7"/><circle cx="460.4" cy="374" r="7"/>
  </g>

  <g clip-path="url(#disc)">
    <!-- shoulders -->
    <path d="M200 408 C160 432 104 444 52 468 L30 560 L482 560 L460 468 C408 444 352 432 312 408 Z" fill="url(#bronze)"/>
    <path d="M150 470 Q204 454 250 470 M362 470 Q308 454 262 470" fill="none" stroke="#2a180a" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M210 340 L302 340 L316 440 Q256 456 196 440 Z" fill="url(#bronze)"/>
    <path d="M210 340 L302 340 L316 440 Q256 456 196 440 Z" fill="url(#fall)"/>
    <path d="M222 392 L210 440 M290 392 L302 440" stroke="#2a180a" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>

    <!-- head -->
    <path id="head" d="M256 94 L322 106 L362 148 L374 214 L366 282 L344 334 L302 372 L256 386 L210 372 L168 334 L146 282 L138 214 L150 148 L190 106 Z" fill="url(#bronze)"/>
    <!-- facets -->
    <path d="M146 282 L204 304 L214 372 L168 334 Z" fill="#000" fill-opacity=".14"/>
    <path d="M366 282 L308 304 L298 372 L344 334 Z" fill="#000" fill-opacity=".28"/>
    <path d="M214 372 L256 358 L298 372 L256 386 Z" fill="#000" fill-opacity=".22"/>
    <!-- hair cap grooves -->
    <g fill="none" stroke="#2e1b0c" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
      <path d="M256 98 V176"/>
      <path d="M228 100 L218 180"/><path d="M284 100 L294 180"/>
      <path d="M200 108 L182 186"/><path d="M312 108 L330 186"/>
      <path d="M174 128 L156 196"/><path d="M338 128 L356 196"/>
    </g>
    <!-- brow curls -->
    <g stroke="#2e1b0c" stroke-opacity=".55" stroke-width="2.5">
      <g fill="#eab86c">
        <circle cx="148" cy="210" r="10"/><circle cx="168" cy="200" r="10"/><circle cx="190" cy="193" r="10"/>
        <circle cx="212" cy="188" r="10"/><circle cx="234" cy="185" r="10"/>
      </g>
      <circle cx="256" cy="184" r="10" fill="#b47b3c"/>
      <g fill="#8a5628">
        <circle cx="278" cy="185" r="10"/><circle cx="300" cy="188" r="10"/><circle cx="322" cy="193" r="10"/>
        <circle cx="344" cy="200" r="10"/><circle cx="364" cy="210" r="10"/>
      </g>
    </g>
    <!-- brow ridge + nose planes -->
    <path d="M160 244 L250 238 L248 262 L178 262 Z" fill="#000" fill-opacity=".22"/>
    <path d="M352 244 L262 238 L264 262 L334 262 Z" fill="#000" fill-opacity=".30"/>
    <path d="M256 240 L276 314 L256 322 Z" fill="#000" fill-opacity=".38"/>
    <path d="M256 240 L240 314 L256 322 Z" fill="#fff" fill-opacity=".10"/>
    <g fill="none" stroke="#24150a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".85">
      <path d="M160 244 L256 238 L352 244"/>
      <path d="M240 316 L256 322 L276 316"/>
      <path d="M228 348 H284"/>
    </g>
    <!-- eyes: the ichor shows through -->
    <g fill="#ff8a1f">
      <path d="M172 270 L240 264 L230 288 L182 289 Z" opacity=".22"/>
      <path d="M272 264 L340 270 L330 289 L282 288 Z" opacity=".22"/>
    </g>
    <g fill="#ffd774">
      <path d="M182 272 L234 268 L226 281 L189 282 Z"/>
      <path d="M278 268 L330 272 L323 282 L286 281 Z"/>
    </g>
    <!-- ichor vein -->
    <g fill="none" stroke-linecap="round">
      <path d="M262 390 C266 424 254 452 262 560" stroke="#ff8a1f" stroke-opacity=".14" stroke-width="22"/>
      <path d="M262 390 C266 424 254 452 262 560" stroke="#ff8a1f" stroke-opacity=".32" stroke-width="11"/>
      <path d="M262 390 C266 424 254 452 262 560" stroke="#ffd774" stroke-width="4.5"/>
    </g>
  </g>
</svg>
